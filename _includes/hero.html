{%- if page.hero -%}
<section class="hero" style="--hero-img: url('{% if page.hero contains '/' %}{{ page.hero | relative_url }}{% else %}{{ '/assets/images/portraits/' | append: page.hero | relative_url }}{% endif %}'); --hero-pos: {{ page.hero_position | default: 'center 25%' }};">
  <div class="hero-inner">
    <h1>{{ page.heading | default: page.title }}</h1>
  </div>
</section>
{%- endif -%}
