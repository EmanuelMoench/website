{%- assign t = site.data.i18n[page.lang] -%}
{%- assign urls = site.data.pages -%}
<section class="cta" style="--cta-img: url('{{ '/assets/images/portraits/portrait-11.jpg' | relative_url }}');">
  <div class="cta-inner">
    <div class="cta-text">
      <h2>{{ t.tagline }}</h2>
      <h3>{{ t.tagline_sub }}</h3>
      <a class="button" href="{{ urls.contact[page.lang] | relative_url }}">{{ t.nav.contact }}</a>
    </div>
  </div>
</section>
