- title: "Forceful or persistent: How the ECB’s New Inflation Target Affects Households’ Inflation Expectations"
  url: https://www.suerf.org/publications/suerf-policy-notes-and-briefs/forceful-or-persistent-how-the-ecbs-new-inflation-target-affects-households-inflation-expectations/
  with: Mathias Hoffmann, Lora Pavlova, and Guido Schultefrankenfeld
  details: "**SUERF Policy Brief** No. 794, February 2024"
  label: teaser
  abstract: >-
    The ECB announced a new monetary policy strategy in July 2021. In contrast to the previous strategy of aiming at
    inflation close to, but below 2 %, it now pursues a symmetric 2% inflation target over the medium term. In
    addition, the ECB explicitly indicated some tolerance for above-target inflation to avoid low inflation from
    becoming entrenched. The main goal of this added clause was to lift private-sector inflation expectations in
    times when policy is constrained by the effective lower bound of interest rates. In this brief, we assess whether
    the new strategy had the intended effects. Using a representative survey of German individuals conducted just
    after the introduction of the new strategy, we find that respondents make little difference between the previous
    strategy of targeting inflation close to but below 2% and the new symmetric 2% inflation target. However, when
    informed about the ECB’s increased tolerance for inflation overshooting, they expect substantially higher
    inflation in the following years when current inflation is running below target.
  links:
    - { label: PDF, url: "/files/papers/SUERF-Policy-Brief-794_Hoffmann-et-al.pdf" }

- title: "Words speak louder than numbers: Central bank communication in times of high inflation"
  url: https://cepr.org/voxeu/columns/words-speak-louder-numbers-central-bank-communication-times-high-inflation
  with: Mathias Hoffmann, Guido Schultefrankenfeld, and Lora Pavlova
  details: "**VoxEU Column**, August 2022"
  label: teaser
  abstract: >-
    In 2022, consumer price inflation in the euro area has climbed to record highs. As a result, many households
    have increased their inflation expectations, thus increasing the risks of more persistent inflation in the
    future. Using the Bundesbank Online Panel Households as a laboratory, this column provides evidence that
    individuals who are shown ECB communication on the inflation outlook significantly reduce their inflation
    expectations. Furthermore, explaining the outlook verbally has a substantially larger effect than merely
    providing numerical projections.

- title: The effects of the ECB’s new inflation target on private households’ inflation expectations
  url: https://www.bundesbank.de/en/publications/research/research-brief/2021-43-inflation-target-881212
  with: Mathias Hoffmann, Guido Schultefrankenfeld, and Lora Pavlova
  details: "**Bundesbank Research Brief** No. 43, November 2021"
  label: teaser
  abstract: >-
    Is there a difference between the inflation expectations of private households in Germany formed under the ECB’s
    previous target definition of “below, but close to, 2%” and those under the new inflation target of
    “symmetrically 2%”? New survey results from the Bundesbank Online Panel Households (BOP-HH) show that the new
    inflation target is associated with moderately higher inflation expectations for the next two to three years.
    The differences become more accentuated when the respondents are also told that the new monetary policy strategy
    entails the possibility of inflation exceeding the target.
  links:
    - { label: PDF, url: "/files/papers/Bundesbank-Research-Brief-43-Nov2021.pdf" }

- title: Climate Change and Monetary Policy in the Euro Area
  url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3928292
  with: many co-authors
  details: ECB Occasional Paper No. 2021/271, September 2021
  abstract: >-
    This paper analyses the implications of climate change for the conduct of monetary policy in the euro area. It
    first investigates macroeconomic and financial risks stemming from climate change and from policies aimed at
    climate mitigation and adaptation, as well as the regulatory and fiscal effects of reducing carbon emissions. In
    this context, it assesses the need to adapt macroeconomic models and the Eurosystem/ECB staff economic
    projections underlying the monetary policy decisions. It further considers the implications of climate change for
    the conduct of monetary policy, in particular the implications for the transmission of monetary policy, the
    natural rate of interest and the correct identification of shocks. Model simulations using the ECB’s New
    Area-Wide Model (NAWM) illustrate how the interactions of climate change, financial and fiscal fragilities could
    significantly restrict the ability of monetary policy to respond to standard business cycle fluctuations. The
    paper concludes with an analysis of a set of potential monetary policy measures to address climate risks,
    insofar as they are in line with the ECB’s mandate.
  links:
    - { label: PDF, url: "/files/papers/ECB_OP271_Sep2021.pdf" }

- title: "Clear, Consistent and Engaging: ECB Monetary Policy Communication in a Changing World"
  url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3928296
  with: many co-authors
  details: ECB Occasional Paper No. 2021/274, September 2021
  abstract: >-
    This paper examines the importance of central bank communication in ensuring the effectiveness of monetary
    policy and in underpinning the credibility, accountability, and legitimacy of independent central banks. It
    documents how communication has become a monetary policy tool in itself; one example of this being forward
    guidance, given its impact on inflation expectations, economic behaviour and inflation. The paper explains why
    and how consistent, clear and effective communication to expert and non-expert audiences is essential in an
    environment of an ever-increasing need by central banks to reach these audiences. Central banks must also meet
    the demand for more understandable information about policies and tools, while at the same time overcoming the
    challenge posed by the wider public’s rational inattention. Since the European Central Bank was established, the
    communications landscape has changed dramatically and continues to evolve. This paper outlines how better
    communication, including greater engagement with the wider public, could help boost people’s understanding of
    and trust in the Eurosystem.
  links:
    - { label: PDF, url: "/files/papers/ECB_OP274_Sep2021.pdf" }

- title: Market liquidity of European sovereign bonds during the Covid-19 crisis
  url: https://safe-frankfurt.de/news-latest/safe-finance-blog/details/market-liquidity-of-european-sovereign-bonds-during-the-covid-19-crisis.html
  with: Loriana Pelizzon and Michael T. Schneider
  details: SAFE Finance Blog, June 2021
  label: teaser
  abstract: >-
    The spread of Covid-19 has caused tremendous stress to public health around the globe. As the scale of the
    pandemic became increasingly clear to investors in March 2020, financial markets were strongly affected – both in
    terms of valuations and their functioning. Economists use the concept of market liquidity to capture the ease of
    trading in financial markets. In this column, we study how market liquidity in European sovereign bonds evolved
    at the start of the pandemic, and explore the main possible drivers of this evolution: “dash for cash” or “dash
    for collateral”.

- title: "‘Dash for cash’ versus ‘dash for collateral’: Market liquidity of European sovereign bonds during the Covid-19 crisis"
  url: https://voxeu.org/article/market-liquidity-european-sovereign-bonds-during-covid-19-crisis
  with: Loriana Pelizzon and Michael T. Schneider
  details: "**VoxEU Column**, March 2021"
  label: teaser
  abstract: >-
    In March 2020, a ‘dash for cash’ driven by the Covid-19 crisis affected the liquidity of the US Treasury bonds
    market as well as numerous other financial markets around the globe. This column investigates how euro area
    sovereign bond markets fared during the same period. While deteriorations in sovereign debt market liquidity are
    evident, these appear to be driven by a ‘dash for collateral’ in euro-denominated safe assets. This suggests some
    differences from the US experience, as well as variations across European countries.

- title: How institutional investment funds’ reach for yield intensifies asset price volatility
  url: https://voxeu.org/article/how-institutional-investment-funds-reach-yield-intensifies-asset-price-volatility
  with: Alexandru Barbu and Christoph Fricke
  details: "**VoxEU Column**, March 2021"
  label: teaser
  abstract: >-
    Institutional funds manage the majority of the assets under management of all German investment funds. This
    column documents that institutional funds act in a strongly procyclical manner, by actively investing in
    higher-yielding, longer-duration and lower-rated assets as yield spreads compress. The authors show that this
    intensifies asset price volatility and highlight reasons behind this procyclical investment behaviour.

- title: How institutional investment funds’ reach for yield intensifies asset price volatility
  url: https://www.bundesbank.de/en/publications/research/research-brief/2021-38-asset-price-volatility-856976
