- title: "Wait and Watch: Steering Monetary Policy Under Balanced Inflation Risks"
  url: https://www.europarl.europa.eu/cmsdata/298533/FSFM_Bonn_Final%20MD%20October.pdf
  with: Benjamin Born, Carl-Wolfram Horn, and Utso Pal Mustafi
  details: Study requested by the European Parliament’s ECON Committee, Monetary Dialogue Papers, September 2025
  label: teaser
  abstract: >-
    This paper summarises the euro-area economic outlook, assesses the ECB’s current monetary policy stance, and
    reviews its policy communication. Inflation is near target and risks surrounding it are broadly balanced, with a
    mild upside tilt. The ECB’s monetary stance is close to neutral: balance sheet normalisation partially offsets
    easing from recent rate cuts. Communication has evolved in recent years, and the data-dependent,
    meeting-by-meeting strategy remains appropriate. Clearer reaction-function guidance could help reduce
    uncertainty about the inflation outlook. This document was provided by the Economic Governance and EMU Scrutiny
    Unit at the request of the Committee on Economic and Monetary Affairs (ECON) ahead of the Monetary Dialogue with
    the ECB President on 6 October 2025.
  links:
    - { label: PDF, url: "/files/papers/EP_MEP_FSFM_Bonn_2510.pdf" }

- title: A KISS for central bank communication in times of high inflation
  url: https://www.suerf.org/publications/suerf-policy-notes-and-briefs/a-kiss-for-central-bank-communication-in-times-of-high-inflation/
  with: Mathias Hoffmann, Lora Pavlova, and Guido Schultefrankenfeld
  details: "**SUERF Policy Brief** No. 1211, July 2025"
  label: teaser
  abstract: >-
    Central banks have used communication about the inflation outlook as an additional policy tool in response to the
    post-pandemic inflation surge. We present novel survey evidence that the ECB’s guidance about its projected
    inflation path can substantially lower households’ inflation expectations when kept in a sophisticatedly simple
    (KISS) way.
  links:
    - { label: PDF, url: "/files/papers/SUERF-Policy-Brief-1211_Hoffmann_et_al_July2025.pdf" }

