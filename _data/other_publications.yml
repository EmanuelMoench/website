- title: The Term Structures of Global Yields
  url: https://www.bis.org/publ/bppdf/bispap102_keynote.pdf
  details: >-
    Keynote address at Bank of Korea – BIS Joint Conference on Asia-Pacific fixed income markets: evolving structure,
    participation and pricing, April 2019
  abstract: >-
    Sovereign bond yields in more than 20 developed and emerging market economies are decomposed into expected short
    rates and term premia using the Adrian, Crump and Moench (2013) approach. I document that (i) term premia account
    for large fractions of global bond yield variation; (ii) the co-movement of sovereign bond yields is, to a large
    extent, driven by the term premium components of sovereign yields, especially in recent years; (iii)
    connectedness and tail dependence between international bond markets are primarily driven by the term premium
    components of global yields; and (iv) global bond yields strongly respond to US target rate shocks, albeit with
    considerable delay. This response is primarily driven by a reassessment of global policy rate expectations.
  links:
    - { label: PDF, url: "/files/papers/Moench_BIS_Keynote_Nov2018.pdf" }

- title: "The Pre-FOMC Announcement Drift: More Recent Evidence"
  url: https://libertystreeteconomics.newyorkfed.org/2018/11/the-pre-fomc-announcement-drift-more-recent-evidence.html
  with: David Lucca
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, November 2018"
  label: teaser
  abstract: >-
    We had previously documented large excess returns on equities ahead of scheduled announcements of the Federal
    Open Market Committee (FOMC)—the Federal Reserve’s monetary policy-making body—between 1994 and 2011. This post
    updates our original analysis with more recent data. We find evidence of continued large excess returns during
    FOMC meetings, but only for those featuring a press conference by the Chair of the FOMC.

- title: The impact of Eurosystem bond purchases on the repo market
  url: https://www.bundesbank.de/en/publications/research/research-brief/2018-21-bond-purchases-repo-market-761744
  with: Stephan Jank
  details: "**Bundesbank Research Brief** No. 21, September 2018"
  label: teaser
  abstract: >-
    German sovereign bonds have become scarce on the European repo market over recent years. A new analysis
    investigates the impact of the Eurosystem’s monetary policy asset purchase programme on the repo market, and
    shows that central bank securities lending can help to counteract scarcity.
  links:
