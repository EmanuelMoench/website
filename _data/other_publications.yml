- title: "Learning from disagreement: Evidence from forecasters"
  url: https://cepr.org/voxeu/columns/learning-disagreement-evidence-forecasters
  with: Philippe Andrade, Richard K. Crump, and Stefano Eusepi
  details: "**VoxEU Column**, December 2014"
  label: teaser
  abstract: >-
    Expectations are critical for macroeconomics and financial markets. But the expectation-formation process is not
    well understood. This column discusses some empirical characteristics of forecast disagreement from professional
    forecasters in the US, and discusses the ‘information frictions’ that underlie the heterogeneity of expectations.

- title: "Data Insight: Which Growth Rate? It’s a Weighty Subject"
  url: http://libertystreeteconomics.newyorkfed.org/2014/12/data-insight-which-growth-rate-its-a-weighty-subject.html
  with: Richard K. Crump, Stefano Eusepi, and David Lucca
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, December 2014"
  label: teaser
  abstract: >-
    The growth rate in real gross domestic product (GDP) is a conventional indicator of the economy’s health. But the
    two ways of measuring annual GDP growth can give very different answers. In 2013, GDP grew 2.2 percent on a
    year-over-year basis, but at a faster 3.1 percent rate on a Q4-over-Q4 basis. So, which measure is more
    meaningful? We show in this post that the Q4/Q4 metric is better since it only considers quarterly growth rates
    during the current year, while the Year/Year measure depends on quarterly growth rates in both the current and
    previous year and puts considerable weight on growth around the turn of the year.

- title: Interest Rate Derivatives and Monetary Policy Expectations
  url: http://libertystreeteconomics.newyorkfed.org/2014/12/interest-rate-derivatives-and-monetary-policy-expectations.html
  with: Richard K. Crump, William O’Boyle, Matthew Raskin, Carlo Rosa, and Lisa Stowe
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, December 2014"
  label: teaser
  abstract: >-
    Market expectations of the path of future policy rates can have important implications for financial markets and
    the economy. Because interest rate derivatives enable market participants to hedge against or speculate on
    potential changes in various short-term U.S. interest rates, they are a rich and timely source of information on
    market expectations. In this post, we describe how information about market expectations can be derived from
    interest rate futures and forwards, focusing on three main instruments: federal funds futures, overnight index
    swaps (OIS), and Eurodollar futures. We also discuss how options on interest rate futures can be used to gain
    insight into the full distribution of rate expectations—information that cannot be gleaned from futures or
    forwards alone. In a forthcoming companion post, we explore an alternative source of policy rate expectations
    based on the two surveys conducted by the Trading Desk at the Federal Reserve Bank of New York.

- title: Survey Measures of Expectations for the Policy Rate
  url: http://libertystreeteconomics.newyorkfed.org/2014/12/survey-measures-of-expectations-for-the-policy-rate.html
  with: Richard K. Crump, William O’Boyle, Matthew Raskin, Carlo Rosa, and Lisa Stowe
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, December 2014"
  label: teaser
  abstract: >-
    Market prices provide timely information on policy expectations. But as we emphasized in our previous post, they
    can deviate from investors’ expectations of the most likely path because they embed risk premiums and represent
    probability-weighted averages over different possible paths. In contrast, surveys explicitly ask respondents for
    their views on the likely path of economic variables. In this post, we highlight two surveys conducted by the
    Federal Reserve Bank of New York that provide information about expectations that can complement market-based
    measures.

- title: "Connecting the Dots: Disagreement in the Federal Open Market Committee"
  url: http://libertystreeteconomics.newyorkfed.org/2014/09/connecting-the-dots-disagreement-in-the-federal-open-market-committee.html
  with: Richard K. Crump, Troy Davig, and Stefano Eusepi
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, September 2014"
  label: teaser
  abstract: >-
    People disagree, and so do the members of the Federal Open Market Committee (FOMC). How much do they disagree?
    Why do they disagree? We look at the FOMC’s projections of the federal funds rate (FFR) and other variables and
    compare them with those in the New York Fed’s Survey of Primary Dealers (SPD). We show that the members of the
    FOMC tend to disagree more than the primary dealers and offer some potential explanations.

- title: "Treasury Term Premia: 1961–Present"
  url: http://libertystreeteconomics.newyorkfed.org/2014/05/treasury-term-premia-1961-present.html
  with: Tobias Adrian, Richard K. Crump, and Benjamin Mills
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, May 2014"
  label: teaser
  abstract: >-
    Treasury yields can be decomposed into two components: expectations of the future path of short-term Treasury
    yields and the Treasury term premium. The term premium is the compensation that investors require for bearing
    the risk that short-term Treasury yields do not evolve as they expected. Studying the term premium over a long
    time period allows us to investigate what has historically driven changes in Treasury yields. In this blog post,
    we estimate and analyze the Treasury term premium from 1961 to the present, and make these estimates available
    for download [here](https://www.newyorkfed.org/research/data_indicators/term-premia-tabs#/interactive).

- title: "Preparing for Takeoff? Professional Forecasters and the June 2013 FOMC Meeting"
  url: http://libertystreeteconomics.newyorkfed.org/2013/09/preparing-for-takeoff-professional-forecasters-and-the-june-2013-fomc-meeting.html
  with: Richard K. Crump and Stefano Eusepi
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, September 2013"
  label: teaser
  abstract: >-
    Following the June 18-19 Federal Open Market Committee (FOMC) meeting different measures of short-term interest
    rates increased notably. In the chart below, we plot two such measures: the two-year Treasury yield and the
    one-year overnight indexed swap (OIS) forward rate, one year in the future. The vertical line indicates the final
    day of the June FOMC meeting. To what extent did this rise in rates following the June FOMC meeting reflect a
    shift in the expected future path of the federal funds rate (FFR)? Market participants and policy makers often
    directly read the expected path from financial market data such as the OIS contracts. In this post, we take an
    alternative approach by looking at surveys of professional forecasters to assess how expectations changed.

- title: Do Treasury Term Premia Rise around Monetary Tightenings?
  url: http://libertystreeteconomics.newyorkfed.org/2013/04/do-treasury-term-premia-rise-around-monetary-tightenings-.html
  with: Tobias Adrian and Richard K. Crump
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, April 2013"
  label: teaser
  abstract: >-
    Some commentators have expressed concern that Treasury yields might rise sharply once the Federal Open Market
    Committee (FOMC) begins to raise the federal funds rate (FFR), worrying, in particular, about a sudden increase in
    Treasury term premia. In this post, we analyze the dynamics of Treasury term premia over the last fifty years and
    discuss their evolution around recent tightening cycles, paying special attention to the 1994 episode when bond
    prices dropped sharply around the world. We find that term premia don’t typically rise when monetary policy
    tightens. We also conclude, based on the behavior of term premia and survey evidence, that the sharp rise in
    Treasury yields in 1994 was in large part due to an upward shift in the expected path of future short-term
    interest rates.

- title: "Making a Statement: How Did Professional Forecasters React to the August 2011 FOMC Statement?"
  url: http://libertystreeteconomics.newyorkfed.org/2013/01/making-a-statement-how-did-professional-forecasters-react-to-the-august-2011-fomc-statement.html
  with: Richard K. Crump and Stefano Eusepi
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, January 2013"
  label: teaser
  abstract: >-
    The Federal Open Market Committee (FOMC) statement released on August 9, 2011, was the first to incorporate
    language on “forward guidance” with an explicit date tied to the Committee’s expected path of monetary policy. In
    this post, we exploit the timing of surveys taken before and after this statement’s release to investigate how
    professional forecasters changed their expectations of growth, inflation, and monetary policy. We find that the
    average forecast of the federal funds rate shifts considerably and closely aligns with the new language in the
    statement, while the average forecasts for growth and inflation change less. While there’s near unanimity among
    forecasters about the future path of the federal funds rate after the August 2011 FOMC statement, forecasters
    maintained differing views on the growth and inflation outlooks.

- title: The Puzzling Pre-FOMC Announcement “Drift”
  url: http://libertystreeteconomics.newyorkfed.org/2012/07/the-puzzling-pre-fomc-announcement-drift.html
  with: David Lucca
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, July 2012"
  label: teaser
  abstract: >-
    For many years, economists have struggled to explain the “equity premium puzzle”—the fact that the average return
    on stocks is larger than what would be expected to compensate for their riskiness. In this post, which draws on
    our recent [New York Fed staff report](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1923197), we deepen
    the puzzle further. We show that since 1994, more than 80 percent of the equity premium on U.S. stocks has been
    earned over the twenty-four hours preceding scheduled Federal Open Market Committee (FOMC) announcements (which
    occur only eight times a year)—a phenomenon we call the pre-FOMC announcement “drift.”

- title: "How Well Do Financial Markets Separate News from Noise? Evidence from an Internet Blooper"
  url: http://libertystreeteconomics.newyorkfed.org/2011/10/how-well-do-financial-markets-separate-news-from-noise-evidence-from-an-internet-blooper.html
  with: Carlos Carvalho and Nick Klagge
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, October 2011"
  label: teaser
  abstract: >-
    How efficiently do financial markets process news of unexpected events? This question becomes particularly
    salient now, as multiple events across the globe drive market movements. Do these gyrations reflect responses to
    fundamental news or to “noise”? In general, it is very difficult to discern how well markets process information,
    because there is no objective way for observers to separate fundamental news from noise components when markets
    react to a news report. In this post, however, we examine an unusual episode involving a false news report that
    provides a unique look into this question. We find that even when noise can be clearly identified, markets may
    take as long as a week to fully process the “signal,” or relevant information, component of news.

- title: A Look at the Accuracy of Policy Expectations
  url: http://libertystreeteconomics.newyorkfed.org/2011/08/a-look-at-the-accuracy-of-policy-expectations-1.html
  with: Richard K. Crump and Stefano Eusepi
  details: "**Federal Reserve Bank of New York Liberty Street Economics Blog**, August 2011"
  label: teaser
  abstract: >-
    Since the 1980s, the primary policy tool of the Federal Reserve has been the federal funds rate. Because
    expectations of the future path of the funds rate play a central role in the term structure of interest rates
    and thus the monetary transmission mechanism, it is important to know how accurate these expectations are in
    predicting the funds rate. In this post, we investigate this issue using a well-known survey of private sector
    forecasters. We find that forecasts tend to over-predict the funds rate in easing cycles and under-predict it in
    tightening cycles. In addition, while forecasts during tightening cycles have become more accurate over time,
    forecast accuracy during easing cycles has not improved.

- title: Why is the Market Share of Adjustable-Rate Mortgages so Low?
  url: https://www.newyorkfed.org/research/current_issues/ci16-8.html
  with: Diego Aragon and James Vickery
  details: "*Current Issues in Economics and Finance*, December 2010"
  abstract: >-
    Over the past several years, U.S. homebuyers have increasingly favored fixed-rate mortgages over adjustable-rate
    mortgages (ARMs). Indeed, ARMs have dropped to less than 10 percent of all residential mortgage originations, a
    near-record low. One might speculate that the decline in the ARM share has been driven by “one-off” factors
    relating to the financial crisis. However, a statistical analysis suggests that recent trends can largely be
    explained by the same factors that have historically shaped mortgage choice—most notably, the term structure of
    interest rates and its effects on the relative price of different types of mortgages. Supply-side factors, in
    particular a rise in the share of mortgages eligible to be securitized by the housing government-sponsored
    enterprises, also play a role in the low current ARM share.
  links:
    - { label: PDF, url: "/files/papers/Moench_Vickery_Aragon(CurrentIssues2010).pdf" }
