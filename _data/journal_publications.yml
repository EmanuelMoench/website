- title: Fundamental Disagreement
  url: https://www.sciencedirect.com/science/article/abs/pii/S0304393216300794
  with: Philippe Andrade, Richard K. Crump, and Stefano Eusepi
  details: "*Journal of Monetary Economics*, Vol. 83, October 2016"
  abstract: >-
    We document a novel set of facts about disagreement among professional forecasters: (1) forecasters disagree at
    all horizons, including the long run; (2) the term structure of disagreement is downward sloping for real output
    growth, relatively flat for inflation, and upward sloping for the federal funds rate; (3) disagreement is time
    varying at all horizons. We propose a generalized model of imperfect information that can jointly explain these
    facts. We further use the term structure of disagreement to show that the monetary policy rule perceived by
    professional forecasters features a high degree of interest-rate smoothing and time variation in the intercept.
  bibtex: |-
    @article{Andrade_Crump_Eusepi_Moench_JME2016,
      title={Fundamental disagreement},
      author={Andrade, Philippe and Crump, Richard K and Eusepi, Stefano and Moench, Emanuel},
      journal={Journal of Monetary Economics},
      volume={83},
      pages={106--128},
      year={2016},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Andrade_Crump_Eusepi_Moench(JME2016).pdf" }

- title: What Predicts U.S. Recessions?
  url: https://www.sciencedirect.com/science/article/abs/pii/S0169207016300279
  with: Weiling Liu
  details: "*International Journal of Forecasting*, Vol. 32 No. 4, October 2016"
  abstract: >-
    We reassess the in- and out-of-sample predictability of US recessions at horizons of three months to two years
    ahead for a large number of previously proposed leading indicator variables, using the Treasury term spread as a
    benchmark. We estimate both univariate and multivariate probit models, and evaluate the relative model
    performance based on the receiver operating characteristic (ROC) curve. At the three- and six-month-ahead
    horizons, various alternative predictor variables increase the accuracy of recession forecasts significantly
    relative to the term spread, with the annual return on the S&P500 index providing the strongest improvement.
    While the Treasury term spread is more difficult to outperform systematically at longer horizons, manufacturers’
    new orders of capital goods and balances in Broker-Dealer margin accounts increase the precision of recession
    predictions significantly at horizons of more than one year.
  bibtex: |-
    @article{Liu_Moench_INTFOR2016,
      title={What predicts US recessions?},
      author={Liu, Weiling and Moench, Emanuel},
      journal={International Journal of Forecasting},
      volume={32},
      number={4},
      pages={1138--1150},
      year={2016},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Liu_Moench(INTFOR2016).pdf" }

- title: Regression-Based Estimation of Dynamic Asset Pricing Models
  url: https://www.sciencedirect.com/science/article/abs/pii/S0304405X15001397
  with: Tobias Adrian and Richard K. Crump
  details: "*Journal of Financial Economics*, Vol. 118 No. 2, November 2015"
  abstract: >-
    We propose regression-based estimators for beta representations of dynamic asset pricing models with an affine
    pricing kernel specification. We allow for state variables that are cross-sectional pricing factors, forecasting
    variables for the price of risk, and factors that are both. The estimators explicitly allow for time-varying
    prices of risk, time-varying betas, and serially dependent pricing factors. Our approach nests the Fama-MacBeth
    two-pass estimator as a special case. We provide asymptotic multistage standard errors necessary to conduct
    inference for asset pricing tests. We illustrate our new estimators in an application to the joint pricing of
    stocks and bonds. The application features strongly time-varying, highly significant prices of risk that are
    found to be quantitatively more important than time-varying betas in reducing pricing errors.
  bibtex: |-
    @article{Adrian_Crump_Moench_JFE2015,
      title={Regression-based estimation of dynamic asset pricing models},
      author={Adrian, Tobias and Crump, Richard K and Moench, Emanuel},
      journal={Journal of Financial Economics},
      volume={118},
      number={2},
      pages={211--244},
      year={2015},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Adrian_Crump_Moench(JFE2015).pdf" }

- title: The Pre-FOMC Announcement Drift
  url: https://onlinelibrary.wiley.com/doi/10.1111/jofi.12196
  with: David Lucca
  details: >-
    Federal Reserve Bank of New York Staff Reports No. 512, July 2013, *Journal of Finance*, Vol. 70 No. 1,
    January 2015, winner of the [Amundi Smith Breeden First Prize](https://afajof.org/prizes/) for the best capital
    markets paper published in the Journal of Finance in 2015
  abstract: >-
    We document large average excess returns on U.S. equities in anticipation of monetary policy decisions made at
    scheduled meetings of the Federal Open Market Committee (FOMC) in the past few decades. These pre-FOMC returns
    have increased over time and account for sizable fractions of total annual realized stock returns. While other
    major international equity indices experienced similar pre-FOMC returns, we find no such effect in U.S. Treasury
    securities and money market futures. Other major U.S. macroeconomic news announcements also do not give rise to
    preannouncement excess equity returns. We discuss challenges in explaining these returns with standard asset
    pricing theory.
  bibtex: |-
    @article{Lucca_Moench_JF2015,
      title={The pre-FOMC announcement drift},
      author={Lucca, David O and Moench, Emanuel},
      journal={The Journal of Finance},
      volume={70},
      number={1},
      pages={329--371},
      year={2015},
      publisher={Wiley Online Library}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Lucca_Moench(JF2015).pdf" }

- title: Dynamic Hierarchical Factor Models
  url: https://direct.mit.edu/rest/article-abstract/95/5/1811/58151/Dynamic-Hierarchical-Factor-Models
  with: Serena Ng and Simon Potter
  details: "*Review of Economics and Statistics*, Vol. 95 No. 5, December 2013"
  abstract: >-
    This paper uses multilevel factor models to characterize within and between-block variations as well as
    idiosyncratic noise in large dynamic panels. Block-level shocks are distinguished from genuinely common shocks,
    and the estimated block-level factors are easy to interpret. The framework achieves dimension reduction and yet
    explicitly allows for heterogeneity between blocks. The model is estimated using an MCMC algorithm that takes
    into account the hierarchical structure of the factors. The importance of block-level variations is illustrated
    in a four-level model estimated on a panel of 445 series related to different categories of real activity in the
    United States.
  bibtex: |-
    @article{Moench_Ng_Potter_REStat2013,
      title={Dynamic hierarchical factor models},
      author={Moench, Emanuel and Ng, Serena and Potter, Simon},
