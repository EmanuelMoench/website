- title: Decomposing Real and Nominal Yield Curves
  url: https://www.sciencedirect.com/science/article/abs/pii/S0304393216301088
  with: Mike Abrahams, Tobias Adrian, Richard K. Crump, and Rui Yu
  details: "*Journal of Monetary Economics*, Vol. 84, December 2016"
  abstract: >-
    Inflation-indexed and nominal yield curves capture investors' expectations of real short rates and inflation as
    well as their required compensation for bearing liquidity, inflation, and real interest rate risk. We estimate
    an affine term structure model that allows us to decompose real and nominal bond yields into these components
    and use the model to study the transmission of monetary policy. The model decompositions imply that the Federal
    Reserve's announcements of LSAPs lowered yields primarily by reducing real term premia. Changes in real term
    premia also account for the strong response of long-term real forward rates to federal funds rate surprises.
  bibtex: |-
    @article{Abrahams_Adrian_Crump_Moench_Yu_JME2016,
      title={Decomposing real and nominal yield curves},
      author={Abrahams, Michael and Adrian, Tobias and Crump, Richard K and Moench, Emanuel and Yu, Rui},
      journal={Journal of Monetary Economics},
      volume={84},
      pages={182--200},
      year={2016},
      publisher={Elsevier}
    }
