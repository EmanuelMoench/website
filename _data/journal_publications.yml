- title: The Persistent Effects of a False News Shock
  url: https://www.sciencedirect.com/science/article/abs/pii/S092753981100020X
  with: Carlos Carvalho and Nick Klagge
  details: "*Journal of Empirical Finance*, Vol. 18 No. 4, September 2011"
  abstract: >-
    In September 2008, a six-year-old article about the 2002 bankruptcy of United Airlines' parent company
    resurfaced on the Internet and was mistakenly believed to be reporting a new bankruptcy filing by the company.
    This episode caused the company's stock price to drop by as much as 76% in just a few minutes, before NASDAQ
    halted trading. After the “news” had been identified as false, the stock price rebounded, but still ended the day
    11.2% below the previous close. We explore this natural experiment by using a simple asset-pricing model to study
    the aftermath of this false news shock. We find that, after three trading sessions, the company's stock was
    still trading below the two-standard-deviation band implied by the model and that it returned to within one
    standard deviation only during the sixth trading session. On the seventh day after the episode, the stock was
    trading at the level predicted by the asset-pricing model. We investigate several potential explanations for
    this finding, but fail to find empirical evidence supporting any of them. We also document that the false news
    shock had a persistent negative effect on the stock prices of other major airline companies. This is consistent
    with the view that contagion effects would have dominated competitive effects had the bankruptcy actually taken
    place.
  bibtex: |-
    @article{Carvalho_Klagge_Moench_JEF2011,
      title={The persistent effects of a false news shock},
      author={Carvalho, Carlos and Klagge, Nicholas and Moench, Emanuel},
      journal={Journal of Empirical Finance},
      volume={18},
      number={4},
      pages={597--615},
      year={2011},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Carvalho_Klagge_Moench(JEF2011).pdf" }

- title: A Hierarchical Factor Analysis of US Housing Market Dynamics
  url: https://academic.oup.com/ectj/article-abstract/14/1/C1/5060345
  with: Serena Ng
  details: "*Econometrics Journal*, Vol. 14, February 2011"
  abstract: >-
    This paper studies the linkages between housing and consumption in the United States taking into account
    regional variation. We estimate national and regional housing factors from a comprehensive set of U.S. price
    and quantity data available at mixed frequencies and over different time spans. Our housing factors pick up the
    common components in the data and are less affected by the idiosyncratic noise in individual series. This allows
    us to get more reliable estimates of the consumption effects of housing market shocks. We find that shocks at
    the national level have large cumulative effects on retail sales in all regions. Though the effects of regional
    shocks are smaller, they are also significant. We analyse the driving forces of housing market activity by means
    of factor-augmented vector autoregressions. Our results show that lowering mortgage rates has a larger effect
    than a similar reduction of the federal funds rate. Moreover, lower consumer confidence and stock prices can slow
    the recovery in the housing market.
  bibtex: |-
    @article{Moench_Ng_EconomJ2011,
      title={A hierarchical factor analysis of US housing market dynamics},
      author={Moench, Emanuel and Ng, Serena},
      journal={The Econometrics Journal},
      volume={14},
      number={1},
      pages={C1--C24},
      year={2011},
      publisher={Wiley Online Library}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Moench_Ng(EconomJ2011).pdf" }

- title: Macro Risk Premium and Intermediary Balance Sheet Quantities
  url: https://link.springer.com/article/10.1057/imfer.2010.5
  with: Tobias Adrian and Hyun Song Shin
  details: "*IMF Economic Review*, Vol. 58 No. 1, July 2010"
  abstract: >-
    The macro risk premium measures the threshold return for real activity that receives funding from savers. The
    balance sheet conditions of financial intermediaries provide a window on the macro risk premium. The tightness of
    intermediaries’ balance sheet constraints determines their “risk appetite,” which in turn, determines the set of
    real projects that receive funding, and hence determines the supply of credit. Monetary policy affects risk
    appetite by changing intermediaries’ ability to leverage their capital. This paper estimates the time-varying
    risk appetite of financial intermediaries for the United States, Germany, United Kingdom, and Japan, and studies
    the joint dynamics of risk appetite with macroeconomic aggregates for the United States. The paper argues that
    risk appetite is an important indicator for monetary conditions.
  bibtex: |-
    @article{Adrian_Moench_Shin_IMFER2010,
      title={Macro risk premium and intermediary balance sheet quantities},
      author={Adrian, Tobias and Moench, Emanuel and Shin, Hyun Song},
      journal={IMF Economic Review},
      volume={58},
      number={1},
      pages={179--207},
      year={2010},
      publisher={Springer}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Adrian_Moench_Shin(IMFER2010).pdf" }

- title: Sectoral Price Data and Models of Price Setting
  url: https://www.sciencedirect.com/science/article/abs/pii/S0304393209000877
  with: Bartosz Maćkowiak and Mirko Wiederholt
  details: "*Journal of Monetary Economics*, Vol. 56, October 2009"
  abstract: >-
    In the median sector, 100 percent of the long-run response of the sectoral price index to a sector-specific shock
    occurs in the month of the shock. The standard Calvo model and the standard sticky-information model can match
    this finding only under extreme assumptions concerning the profit-maximizing price. The rational inattention
    model of Mackowiak and Wiederholt [2009a. Optimal sticky prices under rational inattention. American Economic
    Review 99, 769–803] can match this finding without an extreme assumption concerning the profit-maximizing price.
    Furthermore, there is little variation across sectors in the speed of response of sectoral price indexes to
    sector-specific shocks. The rational inattention model matches this finding, while the Calvo model predicts too
    much cross-sectional variation.
  bibtex: |-
    @article{Mackowiak_Moench_Wiederholt_JME2009,
      title={Sectoral price data and models of price setting},
      author={Ma{\'c}kowiak, Bartosz and Moench, Emanuel and Wiederholt, Mirko},
      journal={Journal of Monetary Economics},
      volume={56},
      pages={S78--S99},
      year={2009},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Mackowiak_Moench_Wiederholt(JME2009).pdf" }

- title: "Forecasting the Yield Curve in a Data-Rich Environment: A No-Arbitrage Factor-Augmented VAR Approach"
  url: https://www.sciencedirect.com/science/article/abs/pii/S0304407608000730
  details: "*Journal of Econometrics*, Vol. 146 No. 1, September 2008"
  abstract: >-
    This paper suggests a term structure model which parsimoniously exploits a broad macroeconomic information set.
    The model uses the short rate and the common components of a large number of macroeconomic variables as factors.
    Precisely, the dynamics of the short rate are modeled with a Factor-Augmented Vector Autoregression and the term
    structure is derived using parameter restrictions implied by no-arbitrage. The model has economic appeal and
    provides better out-of-sample yield forecasts at intermediate and long horizons than a number of previously
    suggested approaches. The forecast improvement is highly significant and particularly pronounced for short and
    medium-term maturities.
  bibtex: |-
    @article{Moench_JoE2008,
      title={Forecasting the yield curve in a data-rich environment: A no-arbitrage factor-augmented VAR approach},
      author={Moench, Emanuel},
      journal={Journal of Econometrics},
      volume={146},
      number={1},
      pages={26--43},
      year={2008},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Moench(JoE2008).pdf" }

- title: Towards a Monthly Business Cycle Chronology for the Euro Area
  url: https://www.oecd.org/en/publications/journal-of-business-cycle-measurement-and-analysis/volume-2005/issue-1_jbcma-v2005-1-en.html
  with: Harald Uhlig
  details: "*Journal of Business Cycle Measurement and Analysis*, Vol. 2 No. 1, May 2005"
  abstract: >-
    This paper is an exercise in dating the Euro area business cycle on a monthly basis. Using a quite flexible
    interpolation routine, we construct several monthly series of Euro area real GDP, and then apply the Bry-Boschan
    (1971) procedure. To account for the asymmetry in growth regimes and duration across business cycle phases, we
    propose to extend this method with a combined amplitude/phase-length criterion ruling out expansionary phases
    that are short and flat. Applying the extended procedure to US and Euro area data, we are able to replicate
    approximately the dating decisions of the National Bureau of Economic Research (NBER) and the Centre for Economic
    Policy Research (CEPR).
  bibtex: |-
    @article{Moench_Uhlig_JBCMA2005,
      title={Towards a Monthly Business Cycle Chronology for the Euro Area},
      author={M{\"o}nch, Emanuel and Uhlig, Harald},
      journal={Journal of Business Cycle Measurement and Analysis},
      volume={2},
      number={1},
      pages={43},
      year={2005}
    }
