- title: "Term Structure Surprises: The Predictive Content of Curvature, Level, and Slope"
  url: https://onlinelibrary.wiley.com/doi/10.1002/jae.1220
  details: "*Journal of Applied Econometrics*, Vol. 27 No. 4, June/July 2012"
  abstract: >-
    This paper analyzes the predictive content of the term structure components level, slope, and curvature within a
    dynamic factor model of macroeconomic and interest rate data. Surprise changes of the three components are
    identified using sign restrictions, and their macroeconomic underpinnings are studied via impulse response
    analysis. The curvature factor is found to carry predictive information both about the future evolution of the
    yield curve and the macroeconomy. In particular, unexpected increases of the curvature factor precede a
    flattening of the yield curve and announce a significant decline of output more than 1 year ahead.
  bibtex: |-
