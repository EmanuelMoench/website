- title: Pricing the Term Structure with Linear Regressions
  url: https://www.sciencedirect.com/science/article/abs/pii/S0304405X13001335
  with: Tobias Adrian and Richard K. Crump
  details: "*Journal of Financial Economics*, Vol. 110 No. 1, October 2013"
  abstract: >-
    We show how to price the time series and cross-section of the term structure of interest rates using a
    three-step linear regression approach. Our method allows computationally fast estimation of term structure
    models with a large number of pricing factors. We present specification tests favoring a model using five
    principal components of yields as factors. We demonstrate that this model outperforms the Cochrane and Piazzesi
    (2008) four-factor specification in out-of-sample exercises but generates similar in-sample term premium
    dynamics. Our regression approach can also incorporate unspanned factors and allows estimation of term structure
    models without observing a zero-coupon yield curve.
  bibtex: |-
    @article{Adrian_Crump_Moench_JFE2013,
      title={Pricing the term structure with linear regressions},
      author={Adrian, Tobias and Crump, Richard K and Moench, Emanuel},
      journal={Journal of Financial Economics},
      volume={110},
      number={1},
      pages={110--138},
      year={2013},
      publisher={Elsevier}
