- title: Comment on “Monetary Policy Communication, Policy Slope, and the Stock Market” by Andreas Neuhierl and Michael Weber
  url: https://www.sciencedirect.com/science/article/abs/pii/S030439321930159X
  with: Tobias Stein
  details: "*Journal of Monetary Economics*, Vol. 108, December 2019"
  abstract: >-
    This note discusses the article “Monetary Policy Communication, Policy Slope, and the Stock Market” by Andreas
    Neuhierl and Michael Weber. The authors document that the slope of the fed funds futures curve predicts stock
    returns one week ahead and is correlated with the tone of Fed Board member speeches over the period 1994–2007.
    We show that this return predictability is restricted to the subsample from 1999 to 2001, with no evidence of
    predictability outside of this period. We further point out some issues with the proposed measure of monetary
    policy tone and show that the positive correlation between tone and the fed funds futures slope is driven by
    two speeches that, when analyzed in detail, do not appear particularly hawkish.
  bibtex: |-
    @article{Moench_Stein_JMEcomment2019,
      title={Comment on “Monetary Policy Communication, Policy Slope, and the Stock Market” by Andreas Neuhierl and Michael Weber},
      author={Moench, Emanuel and Stein, Tobias},
      journal={Journal of Monetary Economics},
      volume={108},
      pages={156--161},
      year={2019},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Moench_Stein(JMEcomment2019).pdf" }

- title: "Forecasting through the Rear-view Mirror: Data Revisions and Bond Return Predictability"
  url: https://academic.oup.com/rfs/article-abstract/31/2/678/4090998
  with: Eric Ghysels and Casidhe Horan
  details: "*Review of Financial Studies*, Vol. 31 No. 2, February 2018"
  abstract: >-
    A previous literature has documented that bond returns are predicted by macroeconomic information not contained
    in yields contemporaneously. That literature has mostly relied on final revised, rather than real time
    macroeconomic data. We show that the use of real time data substantially reduces the predictive power of macro
    variables for future bond returns as well as the implied countercyclicality of term premiums. We discuss
    potential interpretations of our results.
  bibtex: |-
