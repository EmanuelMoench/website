- title: Safe asset scarcity, collateral reuse, and market functioning
  url: https://hub.cepr.org/published-discussion-paper/211589
  with: Stephan Jank and Michael T. Schneider
  details: CEPR Discussion Paper No. 16439, April 2026, forthcoming, ***Journal of Financial Economics***
  abstract: >-
    Quantitative easing contributes to safe asset scarcity and repo market specialness. We show that banks respond
    to scarcity induced by Eurosystem bond purchases by increasing their reuse of these bonds as collateral. While
    reuse is low, additional reuse dampens scarcity effects. However, repo rates become increasingly sensitive to
    asset purchases when reuse is high. Elevated reuse also impairs market functioning: it leads to more failures to
    deliver specific bonds, a higher volatility of repo rates and more pronounced mispricing in the cash bond market.
    Our results highlight a trade-off between the shock absorption and shock amplification effects of collateral reuse.
  bibtex: |-
    @article{Jank_Moench_Schneider_JFE2026,
      title={Safe asset scarcity, collateral reuse, and market functioning},
      author={Jank, Stephan and Moench, Emanuel and Schneider, Michael T.},
      journal={Journal of Financial Economics},
      volume={forthcoming},
      year={2026},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Working-Papers/Jank_Moench_Schneider(CEPRDP_2026).pdf" }

- title: A KISS for central bank communication in times of high inflation
  url: https://www.sciencedirect.com/science/article/pii/S0261560626000707
  with: Mathias Hoffmann, Lora Pavlova, and Guido Schultefrankenfeld
  details: May 2026, ***Journal of International Money and Finance*** Vol. 165
  abstract: >-
    During the post-pandemic inflation surge, many central banks used communication about the inflation outlook to
    limit spillovers from realized to expected inflation. We present novel survey evidence showing that ECB guidance
    about the projected inflation path lowers households’ inflation expectations when inflation is unusually high.
    Qualitative, positively framed messages have the largest effects on short-term expectations, while simple
    visualizations are particularly effective at longer horizons. Effects are heterogeneous across socio-demographic
    groups. Our findings suggest that, regarding their communication, central banks should ‘keep it sophisticatedly
    simple (KISS)’.
  bibtex: |-
    @article{Hoffmann_Moench_Pavlova_Schultefrankenfeld_JIMF2026,
      title={A KISS for central bank communication in times of high inflation},
      author={Hoffmann, Mathias and Moench, Emanuel and Pavlova, Lora and Schultefrankenfeld, Guido},
      journal={Journal of International Money and Finance},
      volume={165},
      year={2026},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Hoffmann_Moench_Pavlova_Schultefrankenfeld(JIMF_2026).pdf" }

- title: Equity Premium Predictability over the Business Cycle
  url: https://www.cambridge.org/core/journals/journal-of-financial-and-quantitative-analysis/article/abs/equity-premium-predictability-over-the-business-cycle/2DB91AB43900E18630D84C78F7FE85A8
  with: Tobias Stein
  details: CEPR Discussion Paper No. 16357, April 2025, forthcoming, *Journal of Financial and Quantitative Analysis*
  abstract: >-
    Equity returns follow a pronounced V-shape pattern around the onset of recessions. They sharply drop into
    negative territory just before business cycle peaks and then strongly recover as the recession unfolds.
    Recessions are typically preceded by a flat yield curve. Probit models relying on the term spread as a predictor
    therefore time the beginning of recessions well. We show that model-implied recession probabilities based on the
    term spread strongly improve equity premium prediction in- and out-of-sample and outperform several benchmark
    predictors. Correcting for a structural break in the mean of the term spread in 1982 further strengthens the
    forecast performance.
  bibtex: |-
    @article{Moench_Stein_JFQA2025,
      title={Equity Premium Predictability over the Business Cycle},
      author={Moench, Emanuel and Stein, Tobias},
      journal={Journal of Financial and Quantitative Analysis},
      volume={forthcoming},
      year={2025},
      publisher={Cambridge University Press}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Moench_Stein(JFQA2025).pdf" }

- title: OTC Discount
  url: https://pubsonline.informs.org/doi/epdf/10.1287/mnsc.2022.00194
  with: Calebe de Roure, Loriana Pelizzon and Michael Schneider
  details: SAFE Working Paper No. 298, August 2024, forthcoming, *Management Science*
  abstract: >-
    We document a pecking order of transaction costs in the interdealer market for German sovereign bonds, where
    three trading protocols coexist. Dealers can trade over-the-counter, either bilaterally or via brokers, as well
    as on an exchange. Trading on the exchange is more expensive than OTC, and broker-intermediated are more costly
    than bilateral OTC trades. The existence of an OTC discount is difficult to square with theories centred around
    search-and-bargaining frictions, but is in line with models of hybrid markets based on information frictions.
    Consistently, we show that dealers' information impacts their choice of trading protocol and that the pecking
    order of transaction costs is aligned with the informational content of order flows across protocols.
    Search-and-bargaining as well as information proxies explain differences in OTC discount within protocols. A
    realistic description of hybrid markets thus requires both types of frictions.
  bibtex: |-
    @article{DeRoure_Moench_Pelizzon_Schneider_MS2025,
      title={OTC Discount},
      author={De Roure, Calebe and Moench, Emanuel and Pelizzon, Loriana and Schneider, Michael},
      journal={Management Science},
      volume={forthcoming},
      year={2025},
      publisher={INFORMS}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/DeRoure_Moench_Pelizzon_Schneider(MS2025).pdf" }

- title: Natural Disasters as Macroeconomic Tail Risks
  url: https://www.sciencedirect.com/science/article/pii/S0304407624002653
  with: Sulkhan Chavleishvili
  details: "*Journal of Econometrics*, Vol. 247, January 2025"
  abstract: >-
    We introduce quantile and moment impulse response functions for structural quantile vector autoregressive
    models. We use them to study how climate-related natural disasters affect the predictive distribution of output
    growth and inflation. Disasters strongly shift the forecast distribution, particularly in the tails. They result
    in an initial sharp increase of the downside risk for growth, followed by a temporary rebound. Upside risk to
    inflation increases markedly for a few months and then subsides. As a result, natural disasters have a
    persistent impact on the conditional variance and skewness of macroeconomic aggregates, which standard linear
    models estimating conditional mean dynamics fail to match. We perform a scenario analysis to evaluate the
    hypothetical effects of more frequent large disasters on the macroeconomy due to increased atmospheric carbon
    concentration. Our results indicate a substantially higher conditional volatility of growth and inflation, as
    well as increased upside risk to inflation, particularly in a scenario where only currently pledged climate
    policies are implemented.
  bibtex: |-
    @article{Chavleishvili_Moench_JoE2025,
      title={Natural disasters as macroeconomic tail risks},
      author={Chavleishvili, Sulkhan and Moench, Emanuel},
      journal={Journal of Econometrics},
      volume={247},
      pages={105914},
      year={2025},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Chavleishvili_Moench(JoE2025).pdf" }
    - { label: Code, url: "https://github.com/EmanuelMoench/website/blob/Replication-Codes/Chavleishvili_Moench_JoE2025_codes.zip" }

- title: Anchored Inflation Expectations
  url: https://www.aeaweb.org/articles?id=10.1257/mac.20200080
  with: Carlos Carvalho, Stefano Eusepi, and Bruce Preston
  details: "*American Economic Journal: Macroeconomics*, Vol. 15(1), Lead Article, January 2023"
  abstract: >-
    We develop a theory of low-frequency movements in inflation expectations, and use it to interpret joint dynamics
    of inflation and inflation expectations for the United States and other countries over the postwar period. In
    our theory, long-run inflation expectations are endogenous. They are driven by short-run inflation surprises, in
    a way that depends on recent forecasting performance and monetary policy. This distinguishes our theory from
    common explanations of low-frequency properties of inflation. The model, estimated using only inflation and
    short-term forecasts from professional surveys, accurately predicts observed measures of long-term inflation
    expectations and identifies episodes of unanchored expectations.
  bibtex: |-
    @article{Carvalho_Eusepi_Moench_Preston_AEJMacro2023,
      title={Anchored inflation expectations},
      author={Carvalho, Carlos and Eusepi, Stefano and Moench, Emanuel and Preston, Bruce},
      journal={American Economic Journal: Macroeconomics},
      volume={15},
      number={1},
      pages={1--47},
      year={2023},
      publisher={American Economic Association}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Carvalho_Eusepi_Moench_Preston(AEJMacro2023).pdf" }

- title: What moves Treasury Yields?
  url: https://www.sciencedirect.com/science/article/abs/pii/S0304405X22000770
  with: Soroosh Soofi Siavash
  details: "*Journal of Financial Economics*, Vol. 146(3), December 2022"
  abstract: >-
    We identify a yield news shock as an innovation that does not move Treasury yields contemporaneously but
    explains a maximum share of their future variation. Yields do not immediately respond to the news shock as the
    initial reaction of term premiums and expected short rates offset each other. While the impact on term premiums
    fades quickly, expected short rates and thus yields decline persistently. As a result, the shock explains a
    staggering 50% of Treasury yield variation several years out. A positive yield news shock is associated with a
    coincident sharp increase in stock and bond market volatility, a contemporaneous response of leading economic
    indicators, and is followed by a persistent decline of real activity and inflation which is accommodated by the
    Federal Reserve. Identified shocks to realized stock market volatility and business cycle news imply similar
    impulse responses and together capture the bulk of variation of the yield news shock.
  bibtex: |-
    @article{Moench_Soofi-Siavash_JFE2022,
      title={What moves treasury yields?},
      author={Moench, Emanuel and Soofi-Siavash, Soroosh},
      journal={Journal of Financial Economics},
      volume={146},
      number={3},
      pages={1016--1043},
      year={2022},
      publisher={Elsevier}
    }
  links:
    - { label: PDF, url: "https://github.com/EmanuelMoench/website/blob/Journal-Publications/Moench_Soofi-Siavash(JFE2022).pdf" }
    - { label: Code, url: "https://github.com/EmanuelMoench/website/blob/Replication-Codes/Moench_Soofi-Siavash_JFE2022_codes.zip" }

