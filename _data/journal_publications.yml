      title={Term structure surprises: the predictive content of curvature, level, and slope},
      author={M{\"o}nch, Emanuel},
      journal={Journal of Applied Econometrics},
      volume={27},
      number={4},
      pages={574--602},
      year={2012},
      publisher={Wiley Online Library}
    }
