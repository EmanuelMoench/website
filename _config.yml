# ---------------------------------------------------------------
#  Site settings — www.emanuelmoench.com
#  Edit the values below; GitHub rebuilds the site automatically.
# ---------------------------------------------------------------

title: Emanuel Mönch
description: Professor of Financial and Monetary Economics at Frankfurt School of Finance & Management.
url: "https://www.emanuelmoench.com"

# Test mode: keeps search engines away while the site runs at test.emanuelmoench.com.
# Set to false when switching to www.emanuelmoench.com.
noindex: true
baseurl: ""

# Contact details (used in the footer and on the contact pages)
contact:
  name: Emanuel Mönch
  address:
    - Frankfurt School of Finance & Management gGmbH
    - Adickesallee 32-34
    - 60322 Frankfurt am Main
  email: e.moench@fs.de
  phone_footer: "+49 69 154008 214"
  phone_footer_link: "+4969154008214"
  phone_office: "+49 69 154008 214"
  phone_office_link: "+4969154008214"
  map: "https://www.google.com/maps/search/?api=1&query=Frankfurt+School+of+Finance+%26+Management+Adickesallee+32-34+Frankfurt"

# Profiles shown as icons in the header
profiles:
  scholar: "https://scholar.google.com/citations?user=8Cuk5vYAAAAJ&hl=en&oi=ao"
  linkedin: "https://www.linkedin.com/in/emanuelmoench/"

# CV link ("Download CV" button)
cv: "/files/CV_Emanuel_Moench.pdf"

# Visitor statistics (Umami, cookie-free). Paste the "Website ID" from
# cloud.umami.is between the quotes to switch statistics on; leave it
# empty to switch them off.
analytics:
  umami_website_id: "1faf2ef1-b83e-4381-ad95-51d75d0f1698"
  umami_script: "https://cloud.umami.is/script.js"

# Profiles that belong to you (used for Google's "Person" information on the About page)
same_as:
  - https://scholar.google.com/citations?user=8Cuk5vYAAAAJ
  - https://www.linkedin.com/in/emanuelmoench/
  - https://www.frankfurt-school.de/en/research-and-faculty/faculty/faculty-directory/emanuel-moench
  - https://cepr.org/about/people/emanuel-moench
  - https://ideas.repec.org/f/pmo414.html
  - https://cetex.org/team/emanuel-moench/

# Centre for Central Banking links
cfcb_nav: "https://fs.de/cfcb"
cfcb_en: "https://fs.de/cfcb"

# ---------------------------------------------------------------
#  Technical settings — normally no need to change anything below
# ---------------------------------------------------------------
plugins:
  - jekyll-sitemap          # creates /sitemap.xml and /robots.txt automatically
markdown: kramdown
kramdown:
  input: GFM
permalink: pretty
exclude:
  - README.md
  - EDITING.md
  - Gemfile
  - Gemfile.lock
  - vendor
defaults:
  - scope: { path: "" }
    values: { layout: page, lang: en }
  - scope: { path: "german" }
    values: { lang: de }
